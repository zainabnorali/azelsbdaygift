<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171a34">
  <title>Тайна Для Азель</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #171a34;
      --lavender: #d8c2ff;
      --soft-white: #fff8ff;
      --muted: #d8d2ef;
      --line: rgba(255, 255, 255, .18);
      --glow: 0 0 28px rgba(191, 157, 255, .34);
      --token-size: 64px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--soft-white);
      font-family: 'Comfortaa', sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #514b83 0%, #292d55 36%, var(--night) 78%);
    }
    button, input { font: inherit; font-family: 'Comfortaa', sans-serif; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .sky {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 85%, rgba(84, 99, 163, .15), transparent 44%),
        linear-gradient(180deg, rgba(24, 27, 59, .02), rgba(10, 13, 35, .34));
    }
    .stars {
      position: absolute; inset: 0; opacity: .78;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 18%, white 98%, transparent),
        radial-gradient(1px 1px at 23% 36%, white 98%, transparent),
        radial-gradient(2px 2px at 39% 13%, white 98%, transparent),
        radial-gradient(1.5px 1.5px at 57% 26%, white 98%, transparent),
        radial-gradient(1px 1px at 76% 12%, white 98%, transparent),
        radial-gradient(2px 2px at 91% 35%, white 98%, transparent),
        radial-gradient(1px 1px at 69% 52%, white 98%, transparent),
        radial-gradient(1.5px 1.5px at 14% 62%, white 98%, transparent),
        radial-gradient(1px 1px at 48% 48%, white 98%, transparent),
        radial-gradient(1.5px 1.5px at 84% 68%, white 98%, transparent);
      background-size: 390px 310px;
      animation: starDrift 32s linear infinite, twinkle 4s ease-in-out infinite alternate;
    }
    .star-dust {
      position: absolute; inset: -10%;
      background-image:
        radial-gradient(1px 1px at 17% 77%, #c9c2ff 98%, transparent),
        radial-gradient(1px 1px at 34% 54%, #fff 98%, transparent),
        radial-gradient(1px 1px at 62% 81%, #d5d0ff 98%, transparent),
        radial-gradient(1px 1px at 79% 43%, #fff 98%, transparent),
        radial-gradient(1px 1px at 95% 89%, #d5d0ff 98%, transparent);
      background-size: 270px 240px; opacity: .55;
      animation: starDrift 60s linear infinite reverse;
    }
    .moon {
      position: absolute; top: calc(6% + var(--safe-top)); right: clamp(6%, 12vw, 19%);
      width: clamp(64px, 18vw, 128px); aspect-ratio: 1;
      filter: drop-shadow(0 0 12px rgba(255, 241, 202, .28)) drop-shadow(0 0 34px rgba(196, 188, 255, .18));
      animation: moonFloat 9s ease-in-out infinite;
    }
    .moon svg { display: block; width: 100%; height: 100%; }
    .moon path { fill: #fff0c9; }
    .ocean {
      position: absolute; left: -10%; right: -10%; bottom: -4%; height: 38%;
      background:
        linear-gradient(180deg, rgba(55, 66, 112, .12), rgba(10, 18, 43, .96)),
        repeating-linear-gradient(177deg, transparent 0 12px, rgba(190, 203, 255, .12) 13px, transparent 15px 29px);
      transform: perspective(500px) rotateX(8deg);
      transform-origin: bottom; opacity: .88;
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 19%);
      mask-image: linear-gradient(to bottom, transparent, black 19%);
    }
    .moon-path {
      position: absolute; top: 48%; right: 14%; width: 10%; height: 30%; opacity: .22;
      background: linear-gradient(180deg, rgba(255, 238, 197, .45), rgba(255, 238, 197, .12) 35%, transparent);
      filter: blur(8px); border-radius: 50%;
    }
    .water-line {
      position: absolute; right: 8%; height: 2px; border-radius: 50%;
      background: rgba(255, 238, 202, .5); filter: blur(.5px);
      animation: waterShimmer 3.5s ease-in-out infinite alternate;
    }
    .water-line:nth-child(1) { top: 16%; width: 28%; }
    .water-line:nth-child(2) { top: 31%; width: 18%; right: 16%; animation-delay: -.8s; }
    .water-line:nth-child(3) { top: 46%; width: 34%; right: 7%; animation-delay: -1.4s; }
    .water-line:nth-child(4) { top: 62%; width: 23%; right: 12%; animation-delay: -.4s; }
    .water-line:nth-child(5) { top: 76%; width: 38%; right: 4%; animation-delay: -2s; }
    .app {
      position: relative; z-index: 1; display: grid; place-items: center;
      min-height: 100vh; min-height: 100svh;
      padding: calc(20px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));
    }
    .content { width: min(100%, 920px); margin: auto; text-align: center; }
    .intro {
      width: 100%; max-width: 690px; margin: 0 auto; padding: 12px 8px;
      text-align: center;
    }
    .story {
      min-height: 7.5rem;
      display: grid;
      place-items: center;
      margin: 8px 0 18px;
    }
    .story-line {
      margin: 0; color: #f0eaff; font-family: 'Caveat', 'Comfortaa', sans-serif;
      font-size: clamp(1.55rem, 6.4vw, 2.35rem); line-height: 1.45;
      opacity: 0; transform: translateY(8px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .story-line.visible { opacity: 1; transform: translateY(0); }
    .primary-button {
      opacity: 0; transform: translateY(8px);
      transition: opacity .8s ease, transform .8s ease, filter .2s ease;
    }
    .primary-button.visible { opacity: 1; transform: translateY(0); }
    .primary-button.fade-out { opacity: 0; transform: translateY(5px); pointer-events: none; }
    .primary-button, .check-button {
      border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 13px 25px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 14px 24px;
      min-height: 48px;
      color: #21183e; background: linear-gradient(135deg, #f0ddff, #bcaaff);
      font-weight: 700; cursor: pointer; box-shadow: 0 8px 28px rgba(168, 136, 255, .19);
    }
    .primary-button:hover, .check-button:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .primary-button:focus-visible, .check-button:focus-visible, input:focus-visible {
      outline: 2px solid white; outline-offset: 4px;
    }
    .quiz-wrap {
      width: 100%;
      transition: opacity .7s ease, transform .7s ease;
    }
    .quiz-wrap.is-leaving {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
    .section-title {
      margin: 0 0 10px; font-size: clamp(1.55rem, 6vw, 2.5rem); font-weight: 400;
      font-family: 'Caveat', 'Comfortaa', sans-serif;
    }
    .section-subtitle { margin: 0 auto 22px; color: var(--muted); line-height: 1.6; max-width: 36rem; }
    .question-grid { display: grid; grid-template-columns: 1fr; gap: 14px; text-align: left; }
    .question-card {
      position: relative; min-width: 0; padding: 20px 16px;
      border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.09);
      box-shadow: 0 15px 45px rgba(0,0,0,.15); backdrop-filter: blur(12px);
      transition: opacity .55s ease, border-color .55s ease, box-shadow .55s ease, transform .55s ease;
      animation: cardEnter .8s both;
    }
    .question-card.locked > * { visibility: hidden; }
    .question-card.locked {
      background: rgba(8, 10, 29, .88);
      border-color: rgba(255, 255, 255, .07); box-shadow: none;
      pointer-events: none; user-select: none;
    }
    .question-card.locked::after {
      content: "🔒"; position: absolute; inset: 0; display: grid; place-items: center;
      visibility: visible; color: #d8c2ff; font-size: 2rem; background: rgba(8, 10, 29, .88);
      border-radius: inherit;
    }
    .question-card:nth-child(2) { animation-delay: .12s; }
    .question-card.unlocked { border-color: rgba(216, 194, 255, .72); box-shadow: var(--glow); }
    .question-card.solved { border-color: rgba(194, 255, 224, .55); box-shadow: 0 0 26px rgba(158, 255, 210, .13); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .card-label { color: #cfc1f4; font-size: .75rem; letter-spacing: .13em; text-transform: uppercase; }
    .lock-mark { font-size: 1.1rem; }
    .equation {
      margin: 4px 0 18px; text-align: center; font-family: Arial, sans-serif;
      font-size: clamp(2rem, 9vw, 3.8rem); font-weight: 600; letter-spacing: .04em;
      color: #fff9ff; text-shadow: 0 0 22px rgba(209, 185, 255, .22);
    }
    .answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
    .answer-input {
      width: 100%; min-width: 0; border: 1px solid rgba(220, 202, 255, .35);
      border-radius: 14px; padding: 12px 10px; color: white; background: rgba(7, 10, 30, .7);
      text-align: center; font-size: 16px;
    }
    .answer-input::placeholder { color: #a8a0c6; }
    .check-button { padding: 12px 14px; border-radius: 14px; white-space: nowrap; }
    .check-button:disabled { opacity: .55; cursor: not-allowed; }
    .feedback { min-height: 28px; margin: 12px 0 0; color: #f3d9ff; font-size: .95rem; }
    .feedback.good { color: #c8ffe4; }
    .hidden { display: none !important; }
    .calendar-shell {
      position: relative; width: min(100%, 720px); margin: 0 auto; padding: 16px 12px;
      border: 1px solid rgba(255,255,255,.25); border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      box-shadow: 0 25px 90px rgba(0,0,0,.25); backdrop-filter: blur(16px);
      opacity: 0; transform: translateY(24px) scale(.96);
      transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), box-shadow .8s ease;
    }
    .calendar-shell.visible { opacity: 1; transform: translateY(0) scale(1); }
    .calendar-shell.zoomed { transform: translateY(0) scale(1); box-shadow: 0 0 65px rgba(183, 150, 255, .2); }
    .calendar-title { margin: 0 0 16px; font-size: clamp(1.3rem, 5vw, 2.2rem); font-weight: 400; letter-spacing: .12em; }
    .months-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .month-tile {
      position: relative; display: grid; place-items: center; min-height: 58px;
      border: 1px solid rgba(255,255,255,.13); border-radius: 14px; color: #e9e1ff;
      background: rgba(12, 15, 41, .55); font: 500 clamp(1.3rem, 5vw, 2.2rem)/1 Arial, sans-serif;
      transition: transform .6s ease, color .6s ease, background .6s ease, box-shadow .6s ease, border-color .6s ease;
    }
    .month-tile.active {
      color: #271943; background: #d8c2ff; border-color: #f0e5ff;
      box-shadow: 0 0 26px rgba(209, 180, 255, .65); transform: scale(1.06);
    }
    .month-focus {
      max-width: 530px; margin: 0 auto; opacity: 0; transform: translateY(16px) scale(.96);
      transition: opacity .8s ease, transform .8s ease;
    }
    .month-focus.visible { opacity: 1; transform: translateY(0) scale(1); }
    .month-focus h2 {
      margin: 0 0 14px; font-family: 'Caveat', 'Comfortaa', sans-serif;
      font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 500; letter-spacing: .12em;
    }
    .weekdays, .month-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .weekdays { margin-bottom: 6px; color: #cfc2ec; font: 500 .68rem/1.2 'Comfortaa', sans-serif; }
    .weekdays span { padding: 6px 0; }
    .month-days { font-family: 'Comfortaa', sans-serif; }
    .day-cell {
      display: grid; place-items: center; min-width: 0; min-height: 36px; aspect-ratio: 1; border-radius: 10px;
      color: #f2ebff; background: rgba(255,255,255,.055); font-size: clamp(.75rem, 2.8vw, 1rem);
      transition: color .6s ease, background .6s ease, box-shadow .6s ease, transform .6s ease;
    }
    .day-cell.is-empty { background: transparent; }
    .day-cell.birthday {
      color: #271943; background: #d8c2ff; box-shadow: 0 0 25px rgba(209, 180, 255, .7);
      font-weight: 700; transform: scale(1.08); animation: birthdayPulse 1.4s ease-in-out infinite alternate;
    }
    .birthday-message {
      margin: 22px 0 0; color: #f0ddff; font-family: 'Caveat', 'Comfortaa', sans-serif;
      font-size: clamp(1.65rem, 6.5vw, 2.8rem); line-height: 1.35;
      text-shadow: 0 0 25px rgba(213, 184, 255, .3);
      opacity: 0; transform: translateY(12px); transition: opacity 1s ease, transform 1s ease;
    }
    .birthday-message.visible { opacity: 1; transform: translateY(0); }
    .tiny-note {
      margin: 14px 0 0; color: rgba(231, 221, 255, .7); font-size: .9rem;
      opacity: 0; transform: translateY(8px); transition: opacity 1s ease, transform 1s ease;
    }
    .tiny-note.visible { opacity: 1; transform: translateY(0); }
    .floating-sparkle {
      position: fixed; z-index: 2; pointer-events: none; color: #f5e9ff; opacity: 0;
      animation: sparkleRise 4.8s ease-in-out infinite;
    }
    .sparkle-one { left: 8%; bottom: 12%; animation-delay: -.7s; }
    .sparkle-two { right: 8%; bottom: 20%; animation-delay: -2.1s; }
    .sparkle-three { left: 18%; top: 14%; animation-delay: -3.2s; }
    .token-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }
    .answer-token {
      position: fixed;
      display: grid;
      place-items: center;
      width: var(--token-size);
      height: var(--token-size);
      margin: 0;
      border: 1px solid rgba(239, 222, 255, .85);
      border-radius: 20px;
      color: #fff8ff;
      background: rgba(171, 137, 255, .55);
      box-shadow: 0 0 32px rgba(195, 162, 255, .55);
      font: 600 clamp(1.6rem, 5vw, 2.4rem)/1 Arial, sans-serif;
      opacity: 0;
      visibility: hidden;
      transform: translate(0, 0) scale(1);
      transform-origin: center;
      will-change: transform, opacity, left, top;
    }
    .answer-token.is-visible {
      opacity: 1;
      visibility: visible;
    }
    @keyframes twinkle { from { opacity: .45; } to { opacity: .95; } }
    @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(-28px); } }
    @keyframes moonFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes waterShimmer {
      from { opacity: .2; transform: scaleX(.75); }
      to { opacity: .85; transform: scaleX(1.08); }
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes birthdayPulse { to { transform: scale(1.14); box-shadow: 0 0 34px rgba(209, 180, 255, .9); } }
    @keyframes sparkleRise {
      0% { opacity: 0; transform: translateY(12px) scale(.7); }
      35% { opacity: .8; }
      100% { opacity: 0; transform: translateY(-35px) scale(1.2); }
    }
    .fade-in { animation: fadeIn .8s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 720px) {
      :root { --token-size: 74px; }
      .app { padding: calc(34px + var(--safe-top)) 18px calc(44px + var(--safe-bottom)); }
      .story { min-height: 110px; }
      .question-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      .question-card { padding: clamp(20px, 3vw, 30px); border-radius: 25px; }
      .answer-input { font-size: 1.2rem; }
      .calendar-shell { padding: clamp(18px, 4vw, 32px); }
      .months-grid { gap: 10px; }
      .month-tile { min-height: clamp(64px, 10vw, 100px); }
      .weekdays, .month-days { gap: 7px; }
      .weekdays { font-size: .8rem; }
      .day-cell { border-radius: 12px; min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stars, .star-dust, .moon, .water-line, .floating-sparkle, .question-card {
        animation: none !important;
      }
      .story-line, .primary-button, .quiz-wrap, .calendar-shell, .month-focus,
      .birthday-message, .tiny-note, .month-tile, .day-cell {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="star-dust"></div>
    <div class="moon">
      <svg viewBox="0 0 100 100" role="presentation" focusable="false">
        <path d="M 69 8 A 43 43 0 1 0 69 92 A 32 43 0 0 1 69 8 Z" />
      </svg>
    </div>
    <div class="moon-path">
      <span class="water-line"></span><span class="water-line"></span><span class="water-line"></span>
      <span class="water-line"></span><span class="water-line"></span>
    </div>
    <div class="ocean"></div>
  </div>
  <span class="floating-sparkle sparkle-one" aria-hidden="true">✧</span>
  <span class="floating-sparkle sparkle-two" aria-hidden="true">✦</span>
  <span class="floating-sparkle sparkle-three" aria-hidden="true">✧</span>
  <main class="app">
    <div class="content">
      <section class="intro" id="intro">
        <div class="story" aria-live="polite"><p class="story-line" id="storyLine"></p></div>
        <button class="primary-button hidden" id="continueButton" type="button">Дальше</button>
      </section>
      <section class="quiz-wrap hidden" id="quiz">
        <h2 class="section-title">Поможешь мне узнать?</h2>
        <p class="section-subtitle">Реши две маленькие загадки — и тайна откроется.</p>
        <div class="question-grid">
          <article class="question-card" id="cardOne">
            <div class="card-top"><span class="card-label">Загадка 01</span><span class="lock-mark" id="markOne" aria-hidden="true">✧</span></div>
            <div class="equation">7 + 4 = ?</div>
            <form class="answer-form" id="formOne">
              <div class="answer-row">
                <input class="answer-input" id="answerOne" type="number" inputmode="numeric" step="1" placeholder="Ответ" required aria-label="Ответ на первый вопрос" autocomplete="off">
                <button class="check-button" id="buttonOne" type="submit">Проверить</button>
              </div>
              <p class="feedback" id="feedbackOne" aria-live="polite"></p>
            </form>
          </article>
          <article class="question-card locked" id="cardTwo" aria-disabled="true">
            <div class="card-top"><span class="card-label">Загадка 02</span><span class="lock-mark" id="markTwo" aria-hidden="true">🔒</span></div>
            <div class="equation">11 + 1 = ?</div>
            <form class="answer-form" id="formTwo">
              <div class="answer-row">
                <input class="answer-input" id="answerTwo" type="number" inputmode="numeric" step="1" placeholder="Ответ" required aria-label="Ответ на второй вопрос" disabled autocomplete="off">
                <button class="check-button" id="buttonTwo" type="submit" disabled>Проверить</button>
              </div>
              <p class="feedback" id="feedbackTwo" aria-live="polite"></p>
            </form>
          </article>
        </div>
      </section>
      <section class="hidden" id="reveal" aria-live="polite">
        <div class="calendar-shell" id="calendarShell">
          <h2 class="calendar-title">Calendar</h2>
          <div class="months-grid" id="monthsGrid" aria-label="Месяцы года"></div>
          <div class="month-focus hidden" id="monthFocus">
            <h2>NOVEMBER</h2>
            <div class="weekdays" aria-hidden="true">
              <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div class="month-days" id="monthDays"></div>
          </div>
        </div>
        <p class="birthday-message" id="birthdayMessage">Дааа! Сегодня день рождения Азель!!💗</p>
        <p class="tiny-note" id="tinyNote">Пусть эта ночь будет чуточку волшебной</p>
      </section>
    </div>
  </main>
  <div class="token-layer" id="tokenLayer" aria-hidden="true">
    <div class="answer-token" id="tokenEleven">11</div>
    <div class="answer-token" id="tokenTwelve">12</div>
  </div>
  <script>
    const intro = document.querySelector("#intro");
    const storyLine = document.querySelector("#storyLine");
    const continueButton = document.querySelector("#continueButton");
    const quiz = document.querySelector("#quiz");
    const cardOne = document.querySelector("#cardOne");
    const cardTwo = document.querySelector("#cardTwo");
    const formOne = document.querySelector("#formOne");
    const formTwo = document.querySelector("#formTwo");
    const answerOne = document.querySelector("#answerOne");
    const answerTwo = document.querySelector("#answerTwo");
    const buttonOne = document.querySelector("#buttonOne");
    const buttonTwo = document.querySelector("#buttonTwo");
    const feedbackOne = document.querySelector("#feedbackOne");
    const feedbackTwo = document.querySelector("#feedbackTwo");
    const markOne = document.querySelector("#markOne");
    const markTwo = document.querySelector("#markTwo");
    const reveal = document.querySelector("#reveal");
    const tokenEleven = document.querySelector("#tokenEleven");
    const tokenTwelve = document.querySelector("#tokenTwelve");
    const calendarShell = document.querySelector("#calendarShell");
    const monthsGrid = document.querySelector("#monthsGrid");
    const monthFocus = document.querySelector("#monthFocus");
    const monthDays = document.querySelector("#monthDays");
    const birthdayMessage = document.querySelector("#birthdayMessage");
    const tinyNote = document.querySelector("#tinyNote");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const introLines = [
      "Привет, Азель!",
      "Красиво сегодня ночью, да?",
      "Мне интересно, какое сегодня число…",
      "Поможешь мне узнать?"
    ];
    let introIndex = 0;
    function wait(ms, keepMotion = false) {
      let duration = ms;
      if (reduceMotion && keepMotion) duration = Math.max(450, Math.round(ms * 0.5));
      else if (reduceMotion) duration = Math.min(ms, 80);
      return new Promise((resolve) => window.setTimeout(resolve, duration));
    }
    function nextFrame() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });
    }
    function showIntroLine() {
      if (introIndex >= introLines.length) return;
      storyLine.classList.remove("visible");
      continueButton.classList.remove("visible", "fade-out");
      window.setTimeout(() => {
        storyLine.textContent = introLines[introIndex];
        storyLine.classList.add("visible");
        introIndex += 1;
        if (introIndex === introLines.length) continueButton.textContent = "Давай";
        continueButton.classList.remove("hidden");
        continueButton.classList.add("visible");
      }, reduceMotion ? 40 : 1000);
    }
    window.setTimeout(showIntroLine, reduceMotion ? 80 : 900);
    continueButton.addEventListener("click", () => {
      continueButton.classList.add("fade-out");
      continueButton.classList.remove("visible");
      if (introIndex < introLines.length) {
        window.setTimeout(showIntroLine, reduceMotion ? 40 : 350);
      } else {
        window.setTimeout(() => {
          intro.classList.add("hidden");
          quiz.classList.remove("hidden");
          quiz.classList.add("fade-in");
          answerOne.focus({ preventScroll: true });
        }, reduceMotion ? 40 : 1000);
      }
    });
    formOne.addEventListener("submit", (event) => {
      event.preventDefault();
      if (answerOne.value.trim() === "") return;
      if (Number(answerOne.value) !== 11) {
        feedbackOne.textContent = "Ой, давай попробуем ещё раз.";
        feedbackOne.classList.remove("good");
        answerOne.value = "";
        answerOne.focus();
        return;
      }
      feedbackOne.textContent = "Правильно!";
      feedbackOne.classList.add("good");
      answerOne.disabled = true;
      buttonOne.disabled = true;
      cardOne.classList.add("solved");
      markOne.textContent = "✓";
      cardTwo.classList.remove("locked");
      cardTwo.classList.add("unlocked");
      cardTwo.removeAttribute("aria-disabled");
      answerTwo.disabled = false;
      buttonTwo.disabled = false;
      markTwo.textContent = "✧";
      answerTwo.focus({ preventScroll: true });
    });
    formTwo.addEventListener("submit", (event) => {
      event.preventDefault();
      if (answerTwo.disabled || answerTwo.value.trim() === "") return;
      if (Number(answerTwo.value) !== 12) {
        feedbackTwo.textContent = "Почти! Попробуй ещё раз.";
        feedbackTwo.classList.remove("good");
        answerTwo.value = "";
        answerTwo.focus();
        return;
      }
      feedbackTwo.textContent = "Да! Ты угадала!";
      feedbackTwo.classList.add("good");
      answerTwo.disabled = true;
      buttonTwo.disabled = true;
      cardTwo.classList.add("solved");
      markTwo.textContent = "✓";
      window.setTimeout(() => {
        startCalendarReveal();
      }, reduceMotion ? 120 : 900);
    });
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    monthNames.forEach((month, index) => {
      const tile = document.createElement("div");
      tile.className = "month-tile";
      tile.textContent = index + 1;
      tile.setAttribute("aria-label", month);
      tile.dataset.month = String(index + 1);
      monthsGrid.appendChild(tile);
    });
    const novemberTile = monthsGrid.querySelector('[data-month="11"]');
    function buildNovember2026() {
      const firstWeekday = new Date(2026, 10, 1).getDay();
      const mondayFirstOffset = (firstWeekday + 6) % 7;
      const numberOfDays = 30;
      for (let i = 0; i < mondayFirstOffset; i += 1) {
        const emptyCell = document.createElement("span");
        emptyCell.className = "day-cell is-empty";
        emptyCell.setAttribute("aria-hidden", "true");
        monthDays.appendChild(emptyCell);
      }
      for (let day = 1; day <= numberOfDays; day += 1) {
        const cell = document.createElement("span");
        cell.className = "day-cell";
        cell.textContent = day;
        if (day === 12) {
          cell.classList.add("birthday-target");
          cell.setAttribute("aria-label", "12 November");
        }
        monthDays.appendChild(cell);
      }
    }
    buildNovember2026();
    function tokenSize() {
      return tokenEleven.getBoundingClientRect().width || 64;
    }
    function placeToken(token, rect) {
      const size = tokenSize();
      token.style.left = `${rect.left + rect.width / 2 - size / 2}px`;
      token.style.top = `${rect.top + rect.height / 2 - size / 2}px`;
      token.style.transform = "translate(0px, 0px) scale(1)";
    }
    function showToken(token, rect, value) {
      token.textContent = value;
      token.style.visibility = "visible";
      token.style.opacity = "1";
      placeToken(token, rect);
      token.classList.add("is-visible");
    }
    async function hideToken(token) {
      if (typeof token.animate === "function") {
        try {
          const fade = token.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: reduceMotion ? 180 : 280, fill: "forwards" }
          );
          if (fade.finished) await fade.finished;
        } catch (error) {
          /* keep going even if the fade is interrupted */
        }
      }
      token.classList.remove("is-visible");
      token.style.opacity = "0";
      token.style.visibility = "hidden";
    }
    async function flyTokenTo(token, target) {
      await nextFrame();
      const from = token.getBoundingClientRect();
      const to = target.getBoundingClientRect();
      if (!to.width || !to.height || !from.width) return;
      const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
      const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
      const scale = Math.max(0.42, Math.min(to.width / from.width, to.height / from.height) * 0.88);
      const duration = reduceMotion ? 800 : 1800;
      const peakScale = Math.max(1.08, scale * 1.12);
      if (typeof token.animate === "function") {
        const animation = token.animate(
          [
            { transform: "translate(0px, 0px) scale(1)", offset: 0 },
            { transform: `translate(${dx * 0.62}px, ${dy * 0.38}px) scale(${peakScale})`, offset: 0.55 },
            { transform: `translate(${dx}px, ${dy}px) scale(${scale})`, offset: 1 }
          ],
          {
            duration,
            easing: "cubic-bezier(.22, .68, .2, 1)",
            fill: "forwards"
          }
        );
        try {
          if (animation.finished) await animation.finished;
          else await wait(duration, true);
          if (typeof animation.commitStyles === "function") animation.commitStyles();
          animation.cancel();
        } catch (error) {
          token.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        }
        return;
      }
      token.style.transition = `transform ${duration}ms cubic-bezier(.22, .68, .2, 1)`;
      await nextFrame();
      token.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      await wait(duration, true);
    }
    async function startCalendarReveal() {
      const elevenRect = answerOne.getBoundingClientRect();
      const twelveRect = answerTwo.getBoundingClientRect();
      const elevenValue = answerOne.value;
      const twelveValue = answerTwo.value;
      showToken(tokenEleven, elevenRect, elevenValue);
      showToken(tokenTwelve, twelveRect, twelveValue);
      await wait(400, true);
      quiz.classList.add("is-leaving");
      await wait(700, true);
      intro.classList.add("hidden");
      quiz.classList.add("hidden");
      reveal.classList.remove("hidden");
      await nextFrame();
      calendarShell.classList.add("visible");
      await wait(750, true);
      await flyTokenTo(tokenEleven, novemberTile);
      novemberTile.classList.add("active");
      await wait(250, true);
      await hideToken(tokenEleven);
      await wait(480, true);
      monthsGrid.classList.add("hidden");
      calendarShell.classList.add("zoomed");
      monthFocus.classList.remove("hidden");
      await nextFrame();
      await nextFrame();
      monthFocus.classList.add("visible");
      await wait(reduceMotion ? 150 : 500);
      await wait(650, true);
      const birthdayCell = monthDays.querySelector(".day-cell.birthday-target");
      await flyTokenTo(tokenTwelve, birthdayCell);
      birthdayCell.classList.add("birthday");
      await wait(220, true);
      await hideToken(tokenTwelve);
      birthdayMessage.classList.add("visible");
      tinyNote.classList.add("visible");
      window.setTimeout(() => {
        birthdayMessage.scrollIntoView({
          behavior: reduceMotion ? "auto" : "smooth",
          block: "center"
        });
      }, reduceMotion ? 40 : 700);
    }
  </script>
</body>
